name: Crackme Pack (B->A, 0xC0000005 repro)

# B: build the C++ VaultBreaker crackme game with MSVC.
# A: pack it with the commercial Program-VM backend and run --verify-output,
#    so an access-violation (0xC0000005) in the packed image is reproduced on
#    a real Windows runner, with a crash dump + exit code captured as evidence.

on:
  push:
    branches: ["claude/**"]
    paths:
      - "test/crackme/**"
      - ".github/workflows/crackme-pack.yml"
      - "src/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CRACKME_SEED: "3134984190"

jobs:
  crackme:
    name: build crackme -> pack -> run -> dump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: MSVC developer environment (cl.exe on PATH)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build btg-packer (release)
        run: cargo build --release --locked

      - name: Build crackme game (B) with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          cl /nologo /O2 /EHsc /std:c++17 `
            test/crackme/vaultbreaker.cpp `
            /Fe:out/crackme.exe /Fo:out/crackme.obj `
            /link user32.lib gdi32.lib 2>&1 | Tee-Object -FilePath out/cl-build.log
          $clExit = $LASTEXITCODE
          Write-Host "--- cl.exe output ---"
          Get-Content out/cl-build.log | Write-Host
          if ($clExit -ne 0) { throw "cl.exe failed: $clExit" }
          if (-not (Test-Path out/crackme.exe)) { throw "crackme.exe not produced" }

      - name: Sanity — run unpacked crackme --headless
        shell: pwsh
        run: |
          $out = & "out/crackme.exe" --headless
          $code = $LASTEXITCODE
          $out | Write-Host
          Write-Host ("unpacked exit={0}" -f $code)
          if ($code -ne 0) { throw "unpacked crackme did not exit 0 (got $code)" }
          if (($out -join "`n") -notmatch "cleared=3/3") {
            throw "unpacked crackme battery did not report cleared=3/3"
          }

      - name: Configure WER local crash dumps (full)
        shell: pwsh
        run: |
          $dumpDir = Join-Path $PWD "crashdumps"
          New-Item -ItemType Directory -Force $dumpDir | Out-Null
          $wer = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $wer -Force | Out-Null
          Set-ItemProperty -Path $wer -Name DumpFolder -Value $dumpDir -Type ExpandString
          Set-ItemProperty -Path $wer -Name DumpType   -Value 2 -Type DWord
          Set-ItemProperty -Path $wer -Name DumpCount  -Value 10 -Type DWord

      - name: Pack crackme with Program-VM + verify (A)
        id: pack
        continue-on-error: true
        shell: pwsh
        run: |
          $input  = "out/crackme.exe"
          $output = "out/crackme.packed.exe"
          Remove-Item -Force $output, "$output.failed.exe" -ErrorAction SilentlyContinue
          $packArgs = @(
            "--input", $input,
            "--output", $output,
            "--vm", "--vm-oep", "--vm-commercial", "--allow-partial-vm",
            "--verify-output", "--verify-timeout-secs", "60",
            "--map", "--sym-map", "--debug", "--log-file", "out/crackme-pack.log",
            "--seed", "$env:CRACKME_SEED"
          )
          Write-Host ("packing: btg-packer " + ($packArgs -join " "))
          & ".\target\release\btg-packer.exe" @packArgs 2>&1 | Tee-Object -FilePath out/packer-console.log
          $code = $LASTEXITCODE
          Write-Host ("packer exit={0}" -f $code)
          exit $code

      - name: Run packed crackme --headless and capture crash
        if: always()
        shell: pwsh
        run: |
          $candidates = @("out/crackme.packed.exe") +
            (Get-ChildItem -File "out/crackme.packed.failed*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          foreach ($exe in $candidates) {
            if (-not (Test-Path $exe)) { continue }
            Write-Host "=== running $exe --headless ==="
            $started = Get-Date
            $p = Start-Process -FilePath $exe -ArgumentList "--headless" -PassThru -Wait -RedirectStandardOutput "out/packed-stdout.txt" -RedirectStandardError "out/packed-stderr.txt"
            $bits = [System.BitConverter]::ToUInt32([System.BitConverter]::GetBytes([int32]$p.ExitCode), 0)
            Write-Host ("[PACKED-RUN] {0} exit=0x{1:X8} ({2})" -f (Split-Path $exe -Leaf), $bits, $p.ExitCode)
            if (Test-Path "out/packed-stdout.txt") { Write-Host "--- stdout ---"; Get-Content "out/packed-stdout.txt" | Write-Host }
            if (Test-Path "out/packed-stderr.txt") { Write-Host "--- stderr ---"; Get-Content "out/packed-stderr.txt" | Write-Host }
            "[PACKED-RUN] {0} exit=0x{1:X8} ({2})" -f (Split-Path $exe -Leaf), $bits, $p.ExitCode | Out-File -Append out/crash-summary.txt
            if ($bits -eq 0xC0000005) {
              Write-Host "[PACKED-RUN] ACCESS_VIOLATION reproduced (0xC0000005)"
              "[PACKED-RUN] ACCESS_VIOLATION reproduced (0xC0000005)" | Out-File -Append out/crash-summary.txt
            }
            Start-Sleep -Seconds 3
            # WER event — filter to the 'Application Error' provider (Id 1000 is
            # shared with Perflib, which is NOT the crash record).
            $evt = Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'; StartTime=$started.AddMinutes(-1)} -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($evt) {
              "===== WER Application Error =====" | Out-File -Append out/crash-summary.txt
              $evt.Message | Out-File -Append out/crash-summary.txt
            }
            # cdb (WinDbg console) gives the faulting RIP, its disassembly, the
            # owning module and the image-base-relative RVA — the decisive datum.
            $cdb = Get-ChildItem `
              "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe", `
              "C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($cdb) {
              # Modules first, decisive lines (faulting insn + RVA) LAST so they
              # land in the MCP log tail.
              # Raw bytes around the call site (unambiguous — ub mis-aligns),
              # plus an aligned forward disasm from the post-call return addr.
              $cmds = 'g; .echo ===MODULES===; lm; .echo ===EXR===; .exr -1; .echo ===REGS===; r; .echo ===STACK===; k; .echo ===FAULTING-INSN===; u @rip L6; .echo ===RVA(rip-imagebase)===; ? @rip - 0x140000000; .echo ===CALLSITE-BYTES(0xB5590..0xB55D0)===; db crackme_packed_failed+0xb5590 L60; .echo ===POST-RET-INSN===; u crackme_packed_failed+0xb55cd L6; q'
              & $cdb.FullName -g -G -c $cmds $exe --headless 2>&1 | Out-File out/cdb.txt
              "===== cdb crash analysis =====" | Out-File -Append out/crash-summary.txt
              Get-Content out/cdb.txt | Out-File -Append out/crash-summary.txt
            } else {
              "cdb.exe not found on runner (no debugger analysis)" | Out-File -Append out/crash-summary.txt
            }
          }
          Get-ChildItem -File "crashdumps" -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime

      - name: Upload crackme pack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crackme-pack-evidence
          path: |
            out/cl-build.log
            out/packer-console.log
            out/crackme.exe
            out/crackme.packed.exe
            out/crackme.packed.failed*.exe
            out/crackme-pack.log
            out/crackme.packed.exe.btgmanifest
            out/crackme.packed.exe.map
            out/crackme.packed.exe.sym
            out/crackme.packed.exe.ownership.csv
            out/packed-stdout.txt
            out/packed-stderr.txt
            out/crash-summary.txt
            out/cdb.txt
            crashdumps/*.dmp
          if-no-files-found: ignore

      - name: Print evidence to job log (tail-visible)
        if: always()
        shell: pwsh
        run: |
          function Dump($path, $tail) {
            Write-Host ""
            Write-Host ("========== {0} ==========" -f $path)
            if (Test-Path $path) {
              if ($tail -gt 0) { Get-Content $path -Tail $tail | Write-Host }
              else { Get-Content $path | Write-Host }
            } else { Write-Host "(absent)" }
          }
          Write-Host "===== out directory ====="; Get-ChildItem -File out -ErrorAction SilentlyContinue | Format-Table Name,Length | Out-String | Write-Host
          Dump "out/packed-stdout.txt" 0
          Dump "out/packed-stderr.txt" 0
          Write-Host "===== crashdumps ====="; Get-ChildItem -File crashdumps -ErrorAction SilentlyContinue | Format-Table Name,Length | Out-String | Write-Host
          Dump "out/crackme-pack.log" 40
          # Put the packer's own error LAST so it lands in the MCP log tail.
          if (Test-Path "out/packer-console.log") {
            Write-Host ""
            Write-Host "========== packer-console.log : matched error lines =========="
            Select-String -Path "out/packer-console.log" -Pattern 'error|panic|thread ''main''|unsupported|reject|not supported|Caused by|coverage|ownership|lift|bail|unwrap|Error:' -CaseSensitive:$false |
              Select-Object -Last 60 | ForEach-Object { Write-Host $_.Line }
            Write-Host ""
            Write-Host "========== packer-console.log : last 40 lines =========="
            Get-Content "out/packer-console.log" -Tail 40 | Write-Host
          } else { Write-Host "packer-console.log (absent)" }
          # CRASH SUMMARY LAST so the faulting module+offset lands in the MCP log tail.
          Write-Host ""
          Write-Host "########## CRASH SUMMARY (packed runtime) ##########"
          if (Test-Path out/crash-summary.txt) { Get-Content out/crash-summary.txt | Write-Host }
          else { Write-Host "(no crash summary — packed exe may not have run)" }
          Write-Host "####################################################"
          if ("${{ steps.pack.outcome }}" -eq "failure") {
            Write-Host "Packing/--verify-output failed (see crash summary above)."
            exit 1
          }
