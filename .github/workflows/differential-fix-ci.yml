name: Differential Fix CI

on:
  push:
    branches:
      - fix/differential-lane-stack-ci
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: cargo check + test + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo check
        run: cargo check --locked --lib

      - name: Cargo build release
        run: cargo build --release --locked

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: btg-packer-windows-x64
          path: target/release/btg-packer.exe
          if-no-files-found: error

      - name: Backward branch regression
        run: cargo test --release --locked --lib test_lifted_fnv_loop_backward_branch_matches_host_arithmetic -- --nocapture --test-threads=1

      - name: Cargo test (serial diagnostics)
        run: cargo test --release --locked --lib -- --nocapture --test-threads=1

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked
