name: Differential Fix CI

on:
  push:
    branches:
      - fix/differential-lane-stack-ci
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: cargo check + test + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo check
        run: cargo check --locked --lib

      - name: Cargo build release
        run: cargo build --release --locked

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: btg-packer-windows-x64
          path: target/release/btg-packer.exe
          if-no-files-found: error

      - name: Commercial Program-VM E2E differential
        id: commercial_e2e
        continue-on-error: true
        shell: pwsh
        run: |
          Remove-Item -Force dummy_target.exe, packed-e2e.exe -ErrorAction SilentlyContinue
          & .\target\release\btg-packer.exe `
            --input dummy_target.exe `
            --output packed-e2e.exe `
            --vm --vm-oep --vm-commercial `
            --verify-output --verify-timeout-secs 15 `
            --seed 31010
          if (-not (Test-Path packed-e2e.exe)) {
            throw "commercial E2E did not produce packed-e2e.exe"
          }

      - name: Capture commercial E2E crash dump
        if: steps.commercial_e2e.outcome == 'failure'
        shell: pwsh
        run: |
          $failed = Get-ChildItem -File "packed-e2e.failed*.exe" | Select-Object -First 1
          if (-not $failed) { throw "isolated failed PE not found" }
          $dumpDir = Join-Path $PWD "crashdumps"
          New-Item -ItemType Directory -Force $dumpDir | Out-Null
          $wer = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$($failed.Name)"
          New-Item -Path $wer -Force | Out-Null
          Set-ItemProperty -Path $wer -Name DumpFolder -Value $dumpDir -Type ExpandString
          Set-ItemProperty -Path $wer -Name DumpType -Value 2 -Type DWord
          $p = Start-Process -FilePath $failed.FullName -PassThru -Wait
          Write-Host ("[CRASH-PROBE] exit=0x{0:X8}" -f ([uint32]$p.ExitCode))
          Start-Sleep -Seconds 2
          Get-ChildItem -File $dumpDir | Format-Table Name,Length,LastWriteTime

      - name: Upload commercial E2E PE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btg-commercial-e2e
          path: |
            packed-e2e.exe
            packed-e2e.failed.exe
            packed-e2e.failed.*.exe
            crashdumps/*.dmp
            packed-e2e.exe.btgmanifest
            packed-e2e.exe.ownership.csv
          if-no-files-found: ignore

      - name: Backward branch regression
        run: cargo test --release --locked --lib test_lifted_fnv_loop_backward_branch_matches_host_arithmetic -- --nocapture --test-threads=1

      - name: Cargo test (serial diagnostics)
        run: cargo test --release --locked --lib -- --nocapture --test-threads=1

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

      - name: Build real Windows QA payload
        run: cargo build --manifest-path test/Cargo.toml

      - name: Commercial Program-VM direct differential
        shell: pwsh
        run: |
          $input = "test/target/debug/rust_packer_test.exe"
          $output = "commercial-direct-verified.exe"
          if (-not (Test-Path $input)) { throw "QA payload missing: $input" }
          & "target/release/btg-packer.exe" --input $input --output $output --vm --vm-oep --vm-commercial --verify-output --verify-timeout-secs 30 --seed 3134984190
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $output)) { throw "verified output missing: $output" }

      - name: Commercial Program-VM corpus E2E
        run: cargo run --release --locked -- --test-qa --qa-commercial

      - name: Upload verified commercial binary
        uses: actions/upload-artifact@v4
        with:
          name: btg-commercial-differential-verified
          path: |
            commercial-direct-verified.exe
            commercial-direct-verified.exe.btgmanifest
          if-no-files-found: error

      - name: Fail on commercial E2E regression
        if: always() && steps.commercial_e2e.outcome == 'failure'
        shell: pwsh
        run: |
          throw "Commercial Program-VM E2E differential failed; diagnostics were uploaded."
