name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: cargo build + test (locked)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Lockfile drift / missing dependency detection: fail if Cargo.lock is stale.
      - name: Check lockfile is up to date
        run: cargo check --locked

      - name: Build (release)
        run: cargo build --release --locked

      # QA tests invoke target/release/btg-packer.exe, so the binary build above
      # is an explicit prerequisite. This prevents a stale local-style packer
      # artifact from being used by the end-to-end gates.
      # Unit / differential tests (T3-1 chacha + VM + pipeline + QA lib tests).
      - name: Test (release)
        run: cargo test --release --locked --lib

      - name: Clippy (mandatory)
        run: cargo clippy --all-targets --all-features --locked

      - name: Windows corpus E2E (pack -> run -> differential)
        run: |
          cargo build --release --manifest-path test/Cargo.toml
          cargo run --release --locked -- --test-qa

      - name: Fuzz regression corpus (mandatory)
        run: cargo test --release --locked self_test::fuzz
