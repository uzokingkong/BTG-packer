[package]
name = "btg-packer"
version = "1.0.0"
edition = "2021"
authors = ["BTG Security Research Team"]
description = "Bidirectional Trigger Graph (BTG) Binary Protection & Obfuscation Packer"
license = "Apache-2.0"
[profile.dev]
debug = true

[[bin]]
name = "btg-packer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
env_logger = "0.11"
goblin = "0.8"
iced-x86 = { version = "1.21", features = ["decoder", "encoder", "block_encoder", "nasm", "fast_fmt"] }
log = "0.4"
rand = "0.8"
thiserror = "1.0"
libc = "0.2"
# T3-1: 차세대 암호 — ChaCha20-Poly1305 (AEAD) + SHA-256 키 도출
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# T3-1 Phase D: standalone Poly1305 reference (RFC 8439) — boot-stub native blob
# differential-test authority.
poly1305 = { version = "0.8", default-features = false }
sha2 = { version = "0.10", default-features = false }
