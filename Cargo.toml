[package]
name = "btg-packer"
version = "1.0.0"
edition = "2021"
authors = ["BTG Security Research Team"]
description = "Bidirectional Trigger Graph (BTG) Binary Protection & Obfuscation Packer"
license = "MIT"
[profile.dev]
debug = true

[[bin]]
name = "btg-packer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
env_logger = "0.11"
goblin = "0.8"
iced-x86 = { version = "1.21", features = ["decoder", "encoder", "block_encoder", "nasm", "fast_fmt"] }
log = "0.4"
rand = "0.8"
thiserror = "1.0"
libc = "0.2"
